[package]
name = "wasm-search"
version = "0.1.0"
edition = "2024"

[dependencies]
tinysearch = { git = "https://github.com/tinysearch/tinysearch", version = "0.9.0", branch = "tinysearch-api" }
wasm-bindgen = { version = "0.2" }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 's'
lto = true
